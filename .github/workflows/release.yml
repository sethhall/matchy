name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip publishing to crates.io (manual builds only)'
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: matchy
            asset_name: matchy-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: matchy
            asset_name: matchy-aarch64-linux
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: matchy
            asset_name: matchy-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: matchy
            asset_name: matchy-aarch64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: matchy.exe
            asset_name: matchy-x86_64-windows
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Build release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      
      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.bin_name }}
          mv ${{ matrix.asset_name }}.tar.gz $GITHUB_WORKSPACE/
      
      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.asset_name }}.zip ${{ matrix.bin_name }}
          mv ${{ matrix.asset_name }}.zip $env:GITHUB_WORKSPACE/
      
      # Collect native library files for Java fat jar
      - name: Collect native library (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p native-lib
          cp target/${{ matrix.target }}/release/libmatchy.so native-lib/libmatchy-${{ matrix.target }}.so
      
      - name: Collect native library (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p native-lib
          cp target/${{ matrix.target }}/release/libmatchy.dylib native-lib/libmatchy-${{ matrix.target }}.dylib
      
      - name: Collect native library (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p native-lib
          cp target/${{ matrix.target }}/release/matchy.dll native-lib/matchy-${{ matrix.target }}.dll
          cp target/${{ matrix.target }}/release/matchy.dll.lib native-lib/matchy-${{ matrix.target }}.dll.lib
      
      - name: Upload native library artifact
        uses: actions/upload-artifact@v5
        with:
          name: native-lib-${{ matrix.target }}
          path: native-lib/*
          if-no-files-found: error
      
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: error

  build-wasm:
    name: Build WASM/WASI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM npm package
        run: wasm-pack build crates/matchy-wasm --target bundler --out-dir pkg-npm

      - name: Create WASM tarball
        run: |
          cd crates/matchy-wasm
          tar czf matchy-wasm-npm.tar.gz pkg-npm
          mv matchy-wasm-npm.tar.gz $GITHUB_WORKSPACE/

      - name: Build WASI module
        run: cargo build -p matchy --target wasm32-wasip1 --release --no-default-features

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v5
        with:
          name: matchy-wasm-npm
          path: matchy-wasm-npm.tar.gz
          if-no-files-found: error

      - name: Upload WASI artifact
        uses: actions/upload-artifact@v5
        with:
          name: matchy-wasi
          path: target/wasm32-wasip1/release/matchy.wasm
          if-no-files-found: error

  bundle-native-libs:
    name: Bundle Native Libraries
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all native library artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: native-lib-*
          path: native-libs-temp
      
      - name: Consolidate native libraries
        run: |
          mkdir -p native-libs
          find native-libs-temp -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.lib' \) -exec cp {} native-libs/ \;
          ls -lh native-libs/
      
      - name: Create native libraries tarball
        run: |
          cd native-libs
          tar czf ../matchy-native-libs.tar.gz *
          cd ..
          sha256sum matchy-native-libs.tar.gz > matchy-native-libs.tar.gz.sha256
      
      - name: Upload consolidated native libraries
        uses: actions/upload-artifact@v5
        with:
          name: matchy-native-libs-bundle
          path: |
            matchy-native-libs.tar.gz
            matchy-native-libs.tar.gz.sha256
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-release, build-wasm, bundle-native-libs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-crates-io:
    name: Publish to crates.io
    needs: build-release
    if: github.event_name == 'push' || !inputs.skip_publish
    runs-on: ubuntu-latest
    environment: release  # Uses the release environment we just created
    permissions:
      id-token: write     # Required for OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "//;s/"//')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version check passed: $CARGO_VERSION"
      
      - name: Update Cargo.lock
        run: cargo update --workspace
      
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      
      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
