name: Deploy mdBook Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'book/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: namespace-profile-linux-amd64
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Install Rust (for preprocessors)
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install mdBook preprocessors
        run: |
          cargo install mdbook-mermaid

      - name: Install project-version preprocessor
        run: |
          cd book/mdbook-project-version
          cargo install --path .

      - name: Build book
        run: |
          cd book
          mdbook build

      - name: Build and copy browser demo
        run: |
          wasm-pack build crates/matchy-wasm --target web --out-dir demo/pkg
          rm -rf book/book/demo
          mkdir -p book/book/demo
          cp -R crates/matchy-wasm/demo/. book/book/demo/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./book/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
