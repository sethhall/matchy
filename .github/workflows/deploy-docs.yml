name: Deploy mdBook Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'book/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: namespace-profile-linux-amd64
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8

      - name: Set up Rust cache
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Install Rust (for preprocessors)
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install mdBook preprocessors
        run: |
          cargo install mdbook-mermaid

      - name: Install project-version preprocessor
        run: |
          cd book/mdbook-project-version
          cargo install --path .

      - name: Test browser feed scripts
        run: |
          node --test scripts/build-threatfox-recent-feed.test.mjs
          node --test crates/matchy-wasm/demo/js/workbench-core.test.mjs

      - name: Build book
        run: |
          cd book
          mdbook build

      - name: Build and assemble Pages site
        run: |
          wasm-pack build crates/matchy-wasm --target web --out-dir demo/pkg

          docs_tmp="$(mktemp -d)"
          cp -R book/book/. "$docs_tmp/"

          rm -rf book/book/docs
          mkdir -p book/book/docs
          cp -R "$docs_tmp"/. book/book/docs/
          rm -rf "$docs_tmp"

          cp crates/matchy-wasm/site/index.html book/book/index.html
          cp crates/matchy-wasm/site/styles.css book/book/styles.css

          rm -rf book/book/console
          mkdir -p book/book/console
          cp -R crates/matchy-wasm/demo/. book/book/console/
          feed_tmp="$(mktemp -d)"
          node scripts/build-threatfox-recent-feed.mjs \
            --url https://threatfox.abuse.ch/export/csv/recent/ \
            --output-csv "$feed_tmp/demo-threats.csv" \
            --output-json book/book/console/assets/demo-threats.json
          cargo run -p matchy -- build "$feed_tmp/demo-threats.csv" \
            --output book/book/console/assets/demo-threats.mxy \
            --input-format csv
          rm -rf "$feed_tmp"
          rm -f book/book/console/assets/demo-threats.csv

          rm -rf book/book/demo
          mkdir -p book/book/demo
          cp crates/matchy-wasm/site/demo-redirect.html book/book/demo/index.html

          node scripts/smoke-pages-site.js book/book

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
