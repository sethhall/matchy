name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable Cargo's automatic cache garbage collection to avoid SQLite lock
  # contention when multiple jobs share the same cached ~/.cargo directory
  CARGO_GC_AUTO: 0

# Default to minimal permissions for all jobs
permissions:
  contents: read

jobs:
  preflight:
    name: Preflight Checks
    runs-on: namespace-profile-linux-amd64
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: [preflight]
    strategy:
      matrix:
        os: [namespace-profile-linux-amd64, namespace-profile-linux-arm64, namespace-profile-macos-26-1, namespace-profile-windows-amd64]
    steps:
      # Namespace runners: use cached checkout
      - name: Checkout (Namespace)
        if: ${{ !contains(matrix.os, 'windows') }}
        uses: namespacelabs/nscloud-checkout-action@v8
      
      # Windows: use standard checkout
      - name: Checkout (Windows)
        if: ${{ contains(matrix.os, 'windows') }}
        uses: actions/checkout@v6
      
      # Namespace runners: use composite action
      - name: Setup Rust (Namespace)
        if: ${{ !contains(matrix.os, 'windows') }}
        uses: ./.github/actions/setup-rust
      
      # Windows: fall back to GitHub Actions cache + manual setup
      - name: Cache cargo (Windows)
        if: ${{ contains(matrix.os, 'windows') }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install Rust (Windows)
        if: ${{ contains(matrix.os, 'windows') }}
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build
        run: cargo build --verbose
      
      - name: Run tests
        run: cargo test --workspace --verbose
      
      - name: Run doc tests
        run: cargo test --workspace --doc
      
      - name: Run examples
        run: cargo run --example cache_demo
      
      - name: Build and run C API tests (Unix)
        if: ${{ !contains(matrix.os, 'windows') && (github.event_name == 'push' || startsWith(github.head_ref, 'release/')) }}
        run: |
          cargo build --release -p matchy
          LD_LIBRARY_PATH=./target/release:$LD_LIBRARY_PATH make test-c test-c-ext test-mmdb
      
      - name: Setup MSVC (Windows)
        if: ${{ contains(matrix.os, 'windows') && (github.event_name == 'push' || startsWith(github.head_ref, 'release/')) }}
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Build and run C API tests (Windows)
        if: ${{ contains(matrix.os, 'windows') && (github.event_name == 'push' || startsWith(github.head_ref, 'release/')) }}
        shell: cmd
        run: |
          cargo build --release -p matchy
          if not exist C:\Temp mkdir C:\Temp
          copy target\release\matchy.dll .
          cl /nologo /W3 /I crates\matchy\include crates\matchy\tests\test_c_api.c /Fe:test_c_api.exe /link /LIBPATH:target\release matchy.dll.lib
          test_c_api.exe
          cl /nologo /W3 /I crates\matchy\include crates\matchy\tests\test_c_api_extensions.c /Fe:test_c_api_ext.exe /link /LIBPATH:target\release matchy.dll.lib
          test_c_api_ext.exe
          cl /nologo /W3 /I crates\matchy\include crates\matchy\tests\test_mmdb_compat.c crates\matchy\src\c_api\mmdb_varargs.c /Fe:test_mmdb.exe /link /LIBPATH:target\release matchy.dll.lib
          test_mmdb.exe

  docs:
    name: Documentation
    runs-on: namespace-profile-linux-amd64
    needs: [preflight]
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      
      - name: Check documentation
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # bench:
  #   name: Benchmarks
  #   runs-on: namespace-profile-linux-amd64
  #   needs: [preflight]
  #   steps:
  #     - uses: actions/checkout@v6
  #     
  #     - name: Install Rust
  #       uses: dtolnay/rust-toolchain@stable
  #     
  #     - name: Cache cargo build
  #       uses: actions/cache@v5
  #       with:
  #         path: target
  #         key: ${{ runner.os }}-cargo-bench
  #     
  #     - name: Compile benchmarks
  #       run: cargo bench --no-run
  #     
  #     - name: Run benchmark smoke test
  #       run: cargo bench -- --test

  coverage:
    name: Code Coverage
    # Only run on main branch pushes or release PRs (expensive job)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: namespace-profile-linux-amd64
    needs: [preflight]
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      
      - name: Install tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      
      - name: Generate coverage (no bench features)
        run: cargo tarpaulin --verbose --workspace --timeout 120 --out xml --engine llvm
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: false

