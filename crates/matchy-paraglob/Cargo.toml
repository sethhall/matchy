[package]
name = "matchy-paraglob"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Glob pattern matching with Aho-Corasick for matchy (internal)"
readme = "../../README.md"

[dependencies]
matchy-match-mode = { path = "../matchy-match-mode", version = "2.0.0" }
matchy-ac = { path = "../matchy-ac", version = "2.0.0" }
matchy-data-format = { path = "../matchy-data-format", version = "2.0.0" }
matchy-ip-trie = { path = "../matchy-ip-trie", version = "2.0.0" }
zerocopy.workspace = true
memchr.workspace = true
anyhow.workspace = true
rustc-hash.workspace = true
serde.workspace = true

[features]
bench-diagnostics = []

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "paraglob_bench"
harness = false

[[bench]]
name = "ac_root_bench"
harness = false

[[bench]]
name = "lookup_diagnostics_bench"
harness = false
required-features = ["bench-diagnostics"]

[lints]
workspace = true
