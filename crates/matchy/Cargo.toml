[package]
name = "matchy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast database for IP address and pattern matching with rich data storage"
readme = "README.md"
keywords = ["ip", "pattern", "database", "geoip", "matching"]
categories = ["network-programming", "database", "algorithms"]
autobins = false
autobenches = false
include = [
    "src/**/*",
    "benches/**/*",
    "examples/**/*",
    "tests/*.rs",
    "tests/*.c",
    "include/**/*",
    "build.rs",
    "cbindgen.toml",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[package.metadata.capi]
min_version = "0.10.0"

[package.metadata.capi.header]
name = "matchy"
subdirectory = "matchy"
generation = true

[package.metadata.capi.install.include]
asset = [{from = "include/matchy/maxminddb.h"}]

[package.metadata.capi.pkg_config]
name = "matchy"
filename = "matchy"
strip_include_path_components = 1

[lib]
name = "matchy"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["cli", "c-api"]
cli = ["clap", "ctrlc", "csv"]
c-api = []
capi = []
dhat-heap = []
auto-update = ["ureq", "dirs"]

[[bin]]
name = "matchy"
path = "src/bin/matchy.rs"
required-features = ["cli"]

[dependencies]
matchy-match-mode = { path = "../matchy-match-mode" }
matchy-ac = { path = "../matchy-ac" }
matchy-ip-trie = { path = "../matchy-ip-trie" }
matchy-data-format = { path = "../matchy-data-format" }
matchy-paraglob = { path = "../matchy-paraglob" }
matchy-literal-hash = { path = "../matchy-literal-hash" }
matchy-format = { path = "../matchy-format" }
matchy-extractor = { path = "../matchy-extractor" }

thiserror.workspace = true
zerocopy.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rustc-hash.workspace = true
xxhash-rust.workspace = true
lru.workspace = true
memchr.workspace = true
rayon.workspace = true
flate2.workspace = true
bs58.workspace = true
sha2.workspace = true
tiny-keccak.workspace = true
bech32.workspace = true

clap = { version = "4.5", features = ["derive", "cargo"], optional = true }
csv = { version = "1.3", optional = true }
ctrlc = { version = "3.5", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc.workspace = true
memmap2.workspace = true
arc-swap.workspace = true
crossbeam-channel.workspace = true

[target.'cfg(target_os = "wasi")'.dependencies]
arc-swap.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.ureq]
version = "2.10"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dependencies.dirs]
version = "5.0"
optional = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winsock2", "ws2def", "ws2ipdef"] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
rand = "0.9"
dhat = "0.3"
assert_cmd = "2.1"
predicates = "3.0"
mockito = "1.6"

[build-dependencies]
cbindgen = "0.29"

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "mmdb_build_bench"
harness = false

[[bench]]
name = "query_profile"
path = "benches/query_profile.rs"
harness = false
