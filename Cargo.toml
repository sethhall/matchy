[workspace]
members = [
    "crates/matchy",
    "crates/matchy-match-mode",
    "crates/matchy-ac",
    "crates/matchy-paraglob",
    "crates/matchy-ip-trie",
    "crates/matchy-data-format",
    "crates/matchy-literal-hash",
    "crates/matchy-format",
    "crates/matchy-extractor",
    "crates/matchy-wasm",
]
default-members = ["crates/matchy"]
resolver = "2"

[workspace.package]
version = "1.2.2"
authors = ["Seth Hall <seth@remor.com>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/matchylabs/matchy"

[workspace.dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Binary/memory
zerocopy = { version = "0.8.27", features = ["derive"] }
memmap2 = "0.9.9"
memchr = "2.7"

# Hashing
rustc-hash = "2.0"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Concurrency
rayon = "1.10"
arc-swap = "1.7"
crossbeam-channel = "0.5"

# Compression
flate2 = { version = "1.1", features = ["rust_backend"], default-features = false }

# Crypto address validation
bs58 = "0.5"
sha2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
bech32 = "0.11"

# Caching
lru = "0.16"

# Platform
libc = "0.2"

# Time (wasm-compatible)
web-time = "1.1"

# Dev dependencies (shared)
criterion = "0.8"
tempfile = "3.8"
proptest = "1.9"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false  # Keep symbols for debugging initially
debug = true   # Enable debug info for profiling

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
