[workspace]
members = [
    "crates/matchy",
    "crates/matchy-match-mode",
    "crates/matchy-ac",
    "crates/matchy-paraglob",
    "crates/matchy-ip-trie",
    "crates/matchy-data-format",
    "crates/matchy-literal-hash",
    "crates/matchy-format",
    "crates/matchy-extractor",
    "crates/matchy-wasm",
]
default-members = ["crates/matchy"]
resolver = "2"

[workspace.package]
version = "2.0.0"
authors = ["Seth Hall <seth@matchylabs.com>"]
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/matchylabs/matchy"

[workspace.dependencies]
# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Binary/memory
zerocopy = { version = "0.8.27", features = ["derive"] }
memmap2 = "0.9.9"
memchr = "2.7"

# Hashing
rustc-hash = "2.0"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }

# Concurrency
rayon = "1.10"
arc-swap = "1.7"
crossbeam-channel = "0.5"

# Compression
flate2 = { version = "1.1", features = ["rust_backend"], default-features = false }

# Crypto address validation
bs58 = "0.5"
sha2 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }
bech32 = "0.11"

# Caching
lru = "0.16"

# Platform
libc = "0.2"

# Time (wasm-compatible)
web-time = "1.1"

# Timestamp parsing/formatting
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Dev dependencies (shared)
criterion = "0.8"
tempfile = "3.8"
proptest = "1.9"

[workspace.lints.clippy]
# Safety
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
ptr_as_ptr = "warn"

# Correctness
must_use_candidate = "warn"
return_self_not_must_use = "warn"
redundant_closure_for_method_calls = "warn"

# Idiomatic Rust
uninlined_format_args = "warn"
use_self = "warn"
semicolon_if_nothing_returned = "warn"
if_not_else = "warn"
match_same_arms = "allow"  # Keep explicit arms for documentation
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
unnecessary_wraps = "warn"
needless_pass_by_value = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
trivially_copy_pass_by_ref = "warn"

# Performance
cast_lossless = "warn"

# Too noisy - disable explicitly
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false  # Keep symbols for debugging initially
debug = true   # Enable debug info for profiling

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
